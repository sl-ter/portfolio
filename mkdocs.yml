site_name: Personal Portfolio
site_description: Majoring in Mechanical Engineering and Minoring in AI applications at Tufts University, while earning the Certificate of International Business from The Fletcher School.
site_url: https://sl-ter.github.io/portfolio/
copyright: Copyright &copy; 2026 Sam Linnington

theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  # Mitsudomoe mark: scripts/make_logo.py -> overrides/.icons/pf/ (favicon: same mark in orange)
  icon:
    logo: pf/mitsudomoe
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

# Built-in plugins only, so the config stays Zensical-compatible.
plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css   # print.css is linked from overrides/main.html, print-only

# Deferred: they run in order after parsing, so none of them holds up the first paint
extra_javascript:
  - path: https://cdn.jsdelivr.net/npm/lenis@1.3.27/dist/lenis.min.js
    defer: true
  - path: javascripts/site.js
    defer: true
  - path: javascripts/pdf-builder.js
    defer: true

extra:
  # Name used in browser-tab titles (site_name is the header label)
  author: Sam Linnington
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sl-ter
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/samuellinnington/
      name: LinkedIn
    - icon: fontawesome/solid/award
      link: https://meritpages.com/samlinnington
      name: Merit
    - icon: fontawesome/solid/envelope
      link: mailto:samuel.linnington@tufts.edu
      name: Email

  # Home-page spotlights, in order. `url` is the organisation's site; `project` is the linked
  # project's source path.
  affiliations:
    - name: The Nemitz Robotics Group
      url: https://sites.tufts.edu/nemitz/activities/
      project: projects/fgf-3d-printing/index.md
      blurb: Specialized in the design and engineering of scalable robotic systems and automated robot manufacturing.
    - name: Z Polymers
      url: https://z-polymers.com/
      project: projects/tullomer-drone-applications/index.md
      blurb: Developing a high-performance material (Tullomer™) at relatively low cost across the health, aerospace and textile industries.

# Project order = site order = PDF builder order.
nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - Tullomer in Drone Applications: projects/tullomer-drone-applications/index.md
      - FGF 3D Printing: projects/fgf-3d-printing/index.md
      - Activity Classification & Distance Tracker Wearable: projects/activity-wearable/index.md
      - NixOS Config: projects/nixos-config/index.md
      - Platform Design with EWB: projects/ewb/index.md
      - Amphibious Human Powered Vehicle: projects/amphibious-hpv/index.md
  - Certificates: certificates.md
  - About: about.md
  - Resume: resume.md
  - Portfolio as a PDF: pdf-builder.md
