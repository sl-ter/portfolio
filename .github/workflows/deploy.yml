name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      # Version our own CSS/JS URLs per deploy, so a browser never pairs fresh pages with a
      # cached older stylesheet or script (Material's own assets are already hashed)
      - run: |
          v="${GITHUB_SHA::8}"
          find site -name '*.html' -exec sed -i -E \
            "s#(stylesheets/(extra|print)\.css|javascripts/(site|pdf-builder)\.js)\"#\1?v=$v\"#g" {} +
          grep -c "site.js?v=$v" site/index.html
      # Print every section the PDF builder offers, plus the cover, into site/pdf/
      - run: |
          pip install -r requirements-pdf.txt
          playwright install --with-deps chromium
          python scripts/build_pdfs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
